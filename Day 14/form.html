<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text" placeholder="First Name" name="firstName" id="firstName"/>
        <input type="text" placeholder="Middle Name" name="middleName" id="middleName"/>
        <input type="text" placeholder="Last Name" name="lastName" id="lastName"/>
        <button onclick="getData(event)">Submit</button>
    </form>
    <form onsubmit="doSomething(event)">
        <input type="text" placeholder="First Name" name="firstName" id="firstName"/>
        <input type="text" placeholder="Middle Name" name="middleName" id="middleName"/>
        <input type="text" placeholder="Last Name" name="lastName" id="lastName"/>
        <button type="submit">Submit</button>
    </form >
       <form onsubmit="doSomething2(event)">
        <input type="text" placeholder="First Name" name="firstName" id="firstName"/>
        <input type="text" placeholder="Middle Name" name="middleName" id="middleName"/>
        <input type="text" placeholder="Last Name" name="lastName" id="lastName"/>
        <button type="submit">Submit</button>
    </form>
</body>
<script>
    // First method
    function getData(e){
        e.preventDefault()
        console.log("From first method",e)
        const firstName=document.getElementById("firstName")
        const middleName=document.getElementById("middleName")
        const lastName=document.getElementById("lastName")
        console.log(firstName.value,middleName.value,lastName.value)

    }
    //second method
    function doSomething(e){
        e.preventDefault()
        console.log("From second method",e)
        const firstName=e.target[0].value
        const middleName=e.target[1].value
        const lastName=e.target[2].value
        console.log(firstName,middleName,lastName)
    }

    //third method
    function doSomething2(e){
        e.preventDefault()
        console.log("From third method",document.forms)
        const form=document.forms[2]//yesle [0] index le form access garxa
        console.log(form)
        const firstName=form[0].value
        const middleName=form[1].value
        const lastName=form[2].value
         console.log("From third method-2",firstName,middleName,lastName)
    }


</script>
</html>
